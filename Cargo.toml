[workspace]
members = [
  "crates/lintrules",
  "crates/lintrules-core",
  "crates/lintrules-provider",
  "crates/lintrules-provider-typesafe",
  "crates/lintrules-provider-cloudflare",
  "crates/lintrules-provider-vercel",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.16"
clap = { version = "4.5.53", features = ["derive"] }
git2 = "0.21.0"
globset = "0.4.18"
gray_matter = "0.3.2"
ignore = "0.4.25"
predicates = "3.1.3"
rayon = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
