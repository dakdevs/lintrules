name: Lintrules

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Optional Git base revision; leave empty to scan the full repository.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: lintrules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork and Dependabot PRs do not receive provider credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify gateway credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [[ -z "$AI_GATEWAY_API_KEY" ]]; then
            echo "::error::Set the AI_GATEWAY_API_KEY repository secret to enable Lintrules."
            exit 1
          fi
      - name: Check Rust rules
        uses: dakdevs/lintrules@v1
        with:
          base: ${{ github.event.pull_request.base.sha || inputs.base }}
          report-scope: all
          working-tree: committed
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lintrules-report
          path: ${{ runner.temp }}/lintrules-report.json
          if-no-files-found: ignore
